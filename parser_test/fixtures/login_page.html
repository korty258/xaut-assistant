<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>西安理工大学统一身份认证</title>
</head>
<body>
  <div class="login-container">
    <h2>西安理工大学 统一身份认证</h2>
    <form id="casLoginForm" action="https://ids.xaut.edu.cn/authserver/login" method="post">
      <input type="text" name="username" placeholder="学号/工号" />
      <input type="password" name="password" placeholder="密码" />
      <button type="submit">登录</button>
    </form>
  </div>
</body>
</html>
