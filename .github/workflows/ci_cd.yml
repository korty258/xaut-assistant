name: CI/CD & Automated Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# 固定 Flutter 版本，保证本地开发环境与 CI 构建结果一致（升级时请同步修改本地 SDK）
env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  # 1. 代码质量与自动化测试 (PR / Push 均运行)
  quality_check:
    name: Lint & Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Verify Tag Matches pubspec & CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC_VERSION=$(tr -d '\r' < xaut_app/pubspec.yaml | grep -E '^version:' | sed -E 's/^version:[[:space:]]*//; s/\+.*//; s/[[:space:]]*$//')
          echo "Tag version: $TAG_VERSION / pubspec version: $PUBSPEC_VERSION"
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::Tag ($GITHUB_REF_NAME) does not match pubspec.yaml version ($PUBSPEC_VERSION)."
            exit 1
          fi
          SECTION_PREVIEW=$(tr -d '\r' < CHANGELOG.md | awk -v ver="$TAG_VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' | sed -e '/./,$!d')
          if [ -z "$SECTION_PREVIEW" ]; then
            echo "::error::CHANGELOG.md has no non-empty section for version [$TAG_VERSION]. Please add it before tagging."
            exit 1
          fi

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: parser_test/package-lock.json

      - name: Install JS Parser Test Dependencies
        working-directory: parser_test
        run: npm ci

      - name: Run JS Parser Regression Tests
        working-directory: parser_test
        run: node --test

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Dependencies
        working-directory: xaut_app
        run: flutter pub get

      - name: Static Analysis
        working-directory: xaut_app
        run: dart analyze --fatal-infos

      - name: Run Unit Tests
        working-directory: xaut_app
        run: flutter test --coverage

  # 2. 编译 Android Release APK (Tag 或手动触发)
  build_android:
    name: Build Android APK
    needs: quality_check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Dependencies
        working-directory: xaut_app
        run: flutter pub get

      - name: Setup Signing Key & Enforce Release Verification
        working-directory: xaut_app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          IS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Injecting official release keystore and key.properties..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n" \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "Signing keys injected successfully."
          else
            if [ "$IS_RELEASE_TAG" = "true" ]; then
              echo "::error::[SECURITY ALERT] Official release tag build requires KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD secrets! Failing build to prevent publishing an APK with debug signature."
              exit 1
            fi
            echo "No signing secrets detected, falling back to build.gradle.kts debug signing fallback for manual/testing workflow_dispatch."
          fi

      - name: Build Android Release APK (arm64-v8a)
        working-directory: xaut_app
        run: flutter build apk --release --target-platform android-arm64

      - name: Prepare Artifact & Verify Signature
        env:
          IS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          cp xaut_app/build/app/outputs/flutter-apk/app-release.apk jinhua_assistant-android-arm64.apk
          if [ "$IS_RELEASE_TAG" = "true" ]; then
            echo "Locating Android SDK apksigner tool..."
            APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n1)
            if [ -z "$APKSIGNER" ] || [ ! -f "$APKSIGNER" ]; then
              echo "::error::[BUILD ERROR] apksigner tool not found in Android build-tools!"
              exit 1
            fi
            echo "Using apksigner at: $APKSIGNER"

            echo "Verifying APK cryptographic integrity and signature schemes (v1, v2, v3, v4)..."
            "$APKSIGNER" verify --print-certs --verbose jinhua_assistant-android-arm64.apk > cert_info.txt
            cat cert_info.txt

            if grep -qi "Android Debug" cert_info.txt; then
              echo "::error::[SECURITY ALERT] The generated APK was signed with Android Debug certificate! Aborting release."
              exit 1
            fi

            EXPECTED_SHA256="${{ secrets.OFFICIAL_CERT_SHA256 }}"
            if [ -z "$EXPECTED_SHA256" ]; then
              EXPECTED_SHA256="a6ae494170718040fe68e2ec41d6d528d027b56da08aeb6d6cdb3fb7a8f1618f"
            fi

            if ! grep -qi "$EXPECTED_SHA256" cert_info.txt; then
              echo "::error::[SECURITY ALERT] Certificate SHA-256 fingerprint mismatch! The APK was signed with an unauthorized certificate. Expected: $EXPECTED_SHA256"
              exit 1
            fi
            echo "Official release certificate SHA-256 fingerprint verified successfully ($EXPECTED_SHA256)."
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: jinhua_assistant-android-arm64.apk

  # 3. 编译 Windows 桌面端绿色版 (Tag 或手动触发)
  build_windows:
    name: Build Windows Desktop
    needs: quality_check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        working-directory: xaut_app
        run: flutter pub get

      - name: Build Windows Release
        working-directory: xaut_app
        run: flutter build windows --release

      - name: Compress Windows Release Bundle
        shell: pwsh
        run: |
          Compress-Archive -Path xaut_app/build/windows/x64/runner/Release/* -DestinationPath jinhua_assistant-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: jinhua_assistant-windows-x64.zip

  # 4. 发布 GitHub Release 产物 (仅在 Tag 触发时执行)
  publish_release:
    name: Publish GitHub Release
    needs: [build_android, build_windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Download Android Artifact
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: ./

      - name: Download Windows Artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-zip
          path: ./

      # Release 正文取自 CHANGELOG.md 中与 Tag 对应的版本段落（如 v2.1.2 -> "## [2.1.2]"），
      # 找不到对应段落时直接失败，保证每个发布版本都有经过维护的变更说明。
      - name: Extract Release Notes from CHANGELOG
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tr -d '\r' < CHANGELOG.md | awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' | sed -e '/./,$!d' > section.md

          if [ ! -s section.md ]; then
            echo "::error::CHANGELOG.md has no section for version [$VERSION]. Please add it before tagging."
            exit 1
          fi

          {
            echo "## 金花助手 ${GITHUB_REF_NAME}"
            echo
            cat section.md
            echo
            echo "---"
            echo
            echo "### 📦 下载与安装"
            echo "- **Android**：下载 \`jinhua_assistant-android-arm64.apk\` 直接安装（仅支持 arm64-v8a 设备）。"
            echo "- **Windows**：下载 \`jinhua_assistant-windows-x64.zip\`，解压后运行 \`jinhua_assistant.exe\`。"
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            jinhua_assistant-android-arm64.apk
            jinhua_assistant-windows-x64.zip
          prerelease: ${{ contains(github.ref_name, 'pre') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          make_latest: ${{ !contains(github.ref_name, 'pre') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'rc') }}
          generate_release_notes: true
