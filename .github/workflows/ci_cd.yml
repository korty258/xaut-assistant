name: CI/CD & Automated Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. 代码质量与自动化测试 (PR / Push 均运行)
  quality_check:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: xaut_app
        run: flutter pub get

      - name: Static Analysis
        working-directory: xaut_app
        run: dart analyze --fatal-infos

      - name: Run Unit Tests
        working-directory: xaut_app
        run: flutter test --coverage

  # 2. 编译 Android Release APK (Tag 或手动触发)
  build_android:
    name: Build Android APK
    needs: quality_check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: xaut_app
        run: flutter pub get

      - name: Setup Signing Key (Optional from Secrets)
        working-directory: xaut_app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Injecting keystore and key.properties..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n" \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          else
            echo "No signing secrets detected, falling back to build.gradle.kts debug signing fallback."
          fi

      - name: Build Android Release APK (arm64-v8a)
        working-directory: xaut_app
        run: flutter build apk --release --target-platform android-arm64

      - name: Prepare Artifact
        run: |
          cp xaut_app/build/app/outputs/flutter-apk/app-release.apk jinhua_assistant-android-arm64.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: jinhua_assistant-android-arm64.apk

  # 3. 编译 Windows 桌面端绿色版 (Tag 或手动触发)
  build_windows:
    name: Build Windows Desktop
    needs: quality_check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        working-directory: xaut_app
        run: flutter pub get

      - name: Build Windows Release
        working-directory: xaut_app
        run: flutter build windows --release

      - name: Compress Windows Release Bundle
        shell: pwsh
        run: |
          Compress-Archive -Path xaut_app/build/windows/x64/runner/Release/* -DestinationPath jinhua_assistant-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: jinhua_assistant-windows-x64.zip

  # 4. 发布 GitHub Release 产物 (仅在 Tag 触发时执行)
  publish_release:
    name: Publish GitHub Release
    needs: [build_android, build_windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jinhua_assistant-android-arm64.apk
            jinhua_assistant-windows-x64.zip
          generate_release_notes: true
