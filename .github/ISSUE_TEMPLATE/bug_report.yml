name: 🐛 缺陷与同步异常反馈 (Bug Report)
description: 提交教务同步失败、数据解析异常或客户端运行缺陷
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈问题！为便于快速定位教务系统改版或设备兼容性问题，请尽可能详细填写以下信息。
        **隐私提示**：请勿在 Issue 中公开任何学号、密码、教务 Cookie 或具体考试成绩等个人敏感信息！
  - type: dropdown
    id: platform
    attributes:
      label: 运行平台 (Platform)
      description: 您正在哪个操作系统上运行金花助手？
      options:
        - Android (ARM64)
        - Windows 11 (x64)
        - Windows 10 (x64)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本 (App Version)
      description: 客户端版本号（如 v2.3.4，可在「关于与法律条款」页面查看）
      placeholder: v2.3.4
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与异常现象 (Steps to Reproduce)
      description: 请描述您执行了什么操作，遇到了什么现象（如：网页登录后点击同步无响应，或提示未检测到课表表格）
      placeholder: |
        1. 打开应用，点击右上角进入教务同步
        2. 在内置网页完成统一身份认证登录
        3. 点击「同步当前课表」
        4. 提示 ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 客户端脱敏诊断摘要 (Desensitized Diagnostic Report)
      description: |
        请前往客户端右上角菜单「关于与法律条款」-> 点击底部「查看并复制诊断摘要」并将内容完整粘贴至此处。
        该摘要完全脱敏，仅包含系统状态码与错误类型，不含任何个人隐私数据。
      placeholder: |
        ### 金花助手客户端诊断摘要 (完全脱敏)
        - **应用版本 (App Version)**: v2.3.4
        ...
      render: markdown
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: 合规与隐私确认
      options:
        - label: 我已核对上述内容，确认**未包含**学号、密码、Cookie 或具体考试成绩等个人敏感信息
          required: true
