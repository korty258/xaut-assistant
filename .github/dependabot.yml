version: 2
updates:
  # 1. Flutter / Dart pub 依赖自动检测 (金花助手主工程)
  - package-ecosystem: "pub"
    directory: "/xaut_app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "flutter"
    # 针对深度绑定的 Windows C++ 原生宿主与 Android Keystore 加密插件，限制 major 破坏性升级
    ignore:
      - dependency-name: "flutter_secure_storage"
        update-types: ["version-update:semver-major"]
      - dependency-name: "webview_windows"
        update-types: ["version-update:semver-major"]

  # 2. JS 解析器回归测试套件 (JSDOM) 依赖自动检测
  - package-ecosystem: "npm"
    directory: "/parser_test"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "parser-test"
